<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Los últimos jardineros del cielo</title>
    <style>@font-face{font-family:"Baloo 2";font-weight:600;src:url(fonts/baloo-2-latin-600-normal.woff2)format("woff2")}@font-face{font-family:"Baloo 2";font-weight:800;src:url(fonts/baloo-2-latin-800-normal.woff2)format("woff2")}html,body{background:#14110f;height:100%;margin:0;overflow:hidden}body{background:radial-gradient(40% 60% at 50% 55%,#3ec9b61a,#0000 70%),radial-gradient(circle at 12% 22%,#e8963a1a 0 2px,#0000 3px) 0 0/140px 160px,radial-gradient(circle at 70% 64%,#b98cff1a 0 2px,#0000 3px) 0 0/190px 210px,radial-gradient(30% 9% at 14% 30%,#f2ece40d,#0000 70%),radial-gradient(26% 8% at 86% 72%,#f2ece40d,#0000 70%),linear-gradient(#1b1714 0%,#100d0b 100%)}:root{--sa-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sa-right:var(--safe-area-inset-right,env(safe-area-inset-right,0px));--sa-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));--sa-left:var(--safe-area-inset-left,env(safe-area-inset-left,0px))}#game{top:var(--sa-top);right:var(--sa-right);bottom:var(--sa-bottom);left:var(--sa-left);position:fixed}#game canvas{box-shadow:0 0 0 3px #14110f,0 0 0 6px #4a443e,0 0 60px #000c}#loading{z-index:20;background:#101010 url(./loading.jpg) 50%/contain no-repeat;transition:opacity .25s;position:fixed;inset:0}#loading.failed{box-sizing:border-box;color:#f2ece4;text-align:center;justify-content:center;align-items:flex-end;padding:0 24px 15vh;font:600 20px/1.3 "Baloo 2",sans-serif;display:flex}</style>
    <script type="module" crossorigin src="/jardineros/assets/index-BKSEBByR.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading"></div>
    <script>
      // Safety net: Boot removes #loading and hides the native splash (launchAutoHide is off). If a module throws before that,
      // hide the splash anyway and say so, instead of leaving the app stuck on the splash for ever.
      (function () {
        function hideSplash() { try { var C = window.Capacitor; if (C && C.nativePromise) C.nativePromise('SplashScreen', 'hide', {}); } catch (e) {} }
        function fail() {
          var l = document.getElementById('loading');
          if (!l) return;
          hideSplash();
          l.className = 'failed';
          l.textContent = 'No se pudo iniciar el juego. Cierra la app y vuelve a abrirla.';
        }
        addEventListener('error', fail);
        addEventListener('unhandledrejection', fail);
        setTimeout(function () { if (document.getElementById('loading')) hideSplash(); }, 15000); // slow boot: show our cover, not the splash
      })();
    </script>
  </body>
</html>
