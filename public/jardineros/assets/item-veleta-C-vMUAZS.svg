<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Veleta de pétalos (Acto 2): un mástil de rama con una flecha de hoja y cuatro pétalos que giran con la corriente -->
  <defs>
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <g filter="url(#wob)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- mástil de rama con base de musgo -->
    <path d="M61 52 L59 112 L69 112 L67 52 Z" fill="#8a5a32"/>
    <path d="M63 60 L62 108" fill="none" stroke="#b07a48" stroke-width="2.4"/>
    <path d="M40 116 Q44 104 56 106 Q64 98 74 105 Q86 103 88 116 Z" fill="#8cc63a"/>
    <!-- flecha de hoja: punta a la derecha, cola de pétalo a la izquierda -->
    <path d="M22 46 L104 46" fill="none" stroke="#1b1714" stroke-width="7"/>
    <path d="M22 46 L104 46" fill="none" stroke="#c9a04e" stroke-width="3"/>
    <path d="M104 36 L122 46 L104 56 Q108 46 104 36 Z" fill="#6fae3a"/>
    <path d="M28 46 Q12 30 8 36 Q12 46 8 56 Q12 62 28 46 Z" fill="#f2a6c8"/>
    <!-- molinillo de cuatro pétalos sobre el eje -->
    <path d="M64 46 Q50 24 60 14 Q72 22 64 46 Z" fill="#f7c3da"/>
    <path d="M64 46 Q86 32 96 42 Q88 54 64 46 Z" fill="#f2a6c8"/>
    <path d="M64 46 Q78 68 68 78 Q56 70 64 46 Z" fill="#f7c3da"/>
    <path d="M64 46 Q42 60 32 50 Q40 38 64 46 Z" fill="#f2a6c8"/>
    <circle cx="64" cy="46" r="6" fill="#e8c34a"/>
  </g>
</svg>
