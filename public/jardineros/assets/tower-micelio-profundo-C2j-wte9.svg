    <path d="M54 80 Q51 70 55 62 H73 Q77 70 74 80 Q64 83 54 80 Z" fill="#e8dcc0"/>
    <path d="M58 70 Q60 68 62 70 M66 70 Q68 68 70 70" fill="none" stroke-width="2.4"/>
