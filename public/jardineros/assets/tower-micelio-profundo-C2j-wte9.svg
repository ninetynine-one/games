    <path d="M12 30 H116 V92 H12 Z" fill="#7a5a40"/>
    <path d="M104 32 H114 V90 H104 Z" fill="#634833" stroke="none"/>
    <path d="M23 40 H105 V82 H23 Z" fill="#2f2620"/>
    <path d="M25 74 Q45 70 64 76 T103 72 V80 H25 Z" fill="#3c3128" stroke="none"/>
    <path d="M16 36 L22 34 M110 86 L104 88 M18 88 L24 86" fill="none" stroke-width="1.8"/>
    <!-- red de hifas sobre la tierra -->
    <path d="M28 78 Q40 66 54 74 Q64 80 74 72 Q86 64 100 74 M40 66 Q36 56 28 50 M88 68 Q92 56 102 52" fill="none" stroke-width="6"/>
    <path d="M28 78 Q40 66 54 74 Q64 80 74 72 Q86 64 100 74 M40 66 Q36 56 28 50 M88 68 Q92 56 102 52" fill="none" stroke="#47d6c2" stroke-width="2.6"/>
    <circle cx="28" cy="50" r="3.4" fill="#d6fff7" stroke-width="2"/>
    <circle cx="102" cy="52" r="3.4" fill="#d6fff7" stroke-width="2"/>
