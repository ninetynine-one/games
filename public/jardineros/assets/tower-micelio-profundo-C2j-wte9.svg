    <path d="M30 64 Q32 34 64 30 Q96 34 98 64 Q82 71 64 70 Q46 71 30 64 Z" fill="#6a4a9e"/>
    <path d="M80 33 Q96 42 97 63 Q90 67 84 68 Q90 48 80 33 Z" fill="#53397e" stroke="none"/>
    <path d="M40 58 Q44 40 64 38 Q84 40 88 58" fill="none" stroke-width="6"/>
    <path d="M40 58 Q44 40 64 38 Q84 40 88 58" fill="none" stroke="#47d6c2" stroke-width="2.6"/>
