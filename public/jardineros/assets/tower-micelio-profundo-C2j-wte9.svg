    <circle cx="134" cy="62" r="4.5" fill="#d6fff7" stroke-width="2.4"/>
    <circle cx="132" cy="112" r="4.5" fill="#d6fff7" stroke-width="2.4"/>
    <circle cx="-4" cy="118" r="4.5" fill="#d6fff7" stroke-width="2.4"/>
    <!-- macetero: cara frontal -->
    <path d="M12 90 H116 V116 H12 Z" fill="#4a3526"/>
    <path d="M12 104 H116 V116 H12 Z" fill="#3a291e" stroke="none"/>
