<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Veleta de pétalos (Acto 2): cuatro pétalos rosas con centro amarillo, mástil de madera con aro de latón, flecha de hoja y mata de musgo -->
  <defs>
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <path id="p" d="M64 40 C52 34 47 20 52 10 Q56 5 61 9 L64 13 L67 9 Q72 5 76 10 C81 20 76 34 64 40 Z"/>
  </defs>
  <g filter="url(#wob)" stroke="#2a1712" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- mástil de madera con aro de latón -->
    <path d="M59 64 L58 110 L70 110 L69 64 Z" fill="#a8683a"/>
    <path d="M63 86 Q60 94 64 102" fill="none" stroke="#7a4524" stroke-width="2"/>
    <rect x="55" y="74" width="18" height="8" rx="3" fill="#d9a44a"/>
    <!-- musgo -->
    <path d="M44 120 Q42 110 52 108 Q56 100 66 104 Q76 100 80 108 Q88 110 84 120 Z" fill="#8bb53a"/>
    <path d="M76 104 Q72 94 78 90 Q82 96 76 104 Z M78 104 Q84 94 90 96 Q88 102 78 104 Z" fill="#9cc64a" stroke-width="2.4"/>
    <!-- varilla con bola de latón y flecha de hoja -->
    <path d="M22 40 L98 40" fill="none" stroke-width="7"/>
    <path d="M22 40 L98 40" fill="none" stroke="#c48a4a" stroke-width="3"/>
    <circle cx="20" cy="40" r="5" fill="#e0a84a"/>
    <path d="M96 40 Q104 28 122 40 Q104 52 96 40 Z" fill="#76ad3a"/>
    <path d="M98 40 L118 40 M106 40 L102 35 M110 40 L106 45" fill="none" stroke="#c6e07a" stroke-width="1.6"/>
    <!-- cuatro pétalos -->
    <g fill="#f7a8bd">
      <use href="#p"/>
      <use href="#p" transform="rotate(90 64 40)"/>
      <use href="#p" transform="rotate(180 64 40)"/>
      <use href="#p" transform="rotate(270 64 40)"/>
    </g>
    <path d="M64 30 L64 18 M74 40 L86 40 M64 50 L64 62 M54 40 L42 40" fill="none" stroke="#fcd5df" stroke-width="2.4"/>
    <circle cx="64" cy="40" r="7" fill="#f2cf3a"/>
  </g>
</svg>
