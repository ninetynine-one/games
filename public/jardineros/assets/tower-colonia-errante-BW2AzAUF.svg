    <path d="M44 82 Q41 62 46 46 H60 Q64 62 62 82 Q53 85 44 82 Z" fill="#e8dcc0"/>
    <path d="M24 48 Q26 14 53 12 Q80 14 82 48 Q66 55 53 54 Q38 55 24 48 Z" fill="#7b52b0"/>
    <path d="M66 15 Q80 24 81 47 Q74 51 69 52 Q75 34 66 15 Z" fill="#5e3d8c" stroke="none"/>
