    <path d="M30 84 Q29 76 31 72 H36 Q38 78 37 84 Z" fill="#e8dcc0" stroke-width="2.4"/>
    <path d="M22 73 Q24 62 33 62 Q42 62 44 73 Q33 77 22 73 Z" fill="#9a6bd8" stroke-width="2.6"/>
    <circle cx="31" cy="67" r="2" fill="#47d6c2" stroke-width="1.4"/>
