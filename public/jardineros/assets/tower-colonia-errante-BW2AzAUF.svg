    <path d="M90 26 Q104 10 120 12" fill="none" stroke="#b58ee6" stroke-width="2.4" stroke-dasharray="2 6"/>
    <path d="M20 22 Q10 12 4 4" fill="none" stroke="#b58ee6" stroke-width="2.4" stroke-dasharray="2 6"/>
