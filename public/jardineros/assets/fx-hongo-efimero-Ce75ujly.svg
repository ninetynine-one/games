<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Hongo temporal: brota donde muere un infectado; no es muro, dura 20 s -->
  <defs>
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
  </defs>
  <g filter="url(#wob)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- montículo de tierra removida con esporas -->
    <path d="M14 108 Q20 88 44 88 Q64 82 84 88 Q110 88 114 108 Q64 118 14 108 Z" fill="#3a2e25"/>
    <path d="M24 104 Q40 96 56 100 M72 98 Q90 94 104 102" fill="none" stroke="#4d6138" stroke-width="2.6"/>
    <circle cx="24" cy="98" r="3" fill="#b58ee6" stroke-width="1.8"/>
    <circle cx="104" cy="96" r="2.6" fill="#b58ee6" stroke-width="1.8"/>
    <!-- hongo grande -->
    <path d="M56 104 Q52 82 58 66 H72 Q77 82 74 104 Q65 107 56 104 Z" fill="#efe6d2"/>
    <path d="M30 70 Q32 36 64 32 Q96 36 98 70 Q80 78 64 77 Q46 78 30 70 Z" fill="#9a74c8"/>
    <path d="M78 36 Q95 44 97 69 Q90 73 84 74 Q90 52 78 36 Z" fill="#7b52b0" stroke="none"/>
    <path d="M38 48 Q44 38 56 35" fill="none" stroke="#d9c4f2" stroke-width="3"/>
    <circle cx="50" cy="52" r="4.5" fill="#5ff0dc" stroke-width="2.2"/>
    <circle cx="76" cy="46" r="3.6" fill="#5ff0dc" stroke-width="2"/>
    <circle cx="66" cy="62" r="2.6" fill="#5ff0dc" stroke-width="1.8"/>
    <!-- hongo pequeño -->
    <path d="M88 106 Q87 96 89 90 H95 Q97 98 96 106 Z" fill="#efe6d2" stroke-width="2.6"/>
    <path d="M80 92 Q82 78 92 78 Q102 78 104 92 Q92 96 80 92 Z" fill="#9a74c8" stroke-width="2.8"/>
    <!-- destellos de brote -->
    <path d="M24 40 L28 48 M20 54 L28 52 M106 30 L100 38 M112 46 L104 46" fill="none" stroke="#5ff0dc" stroke-width="3"/>
    <circle cx="64" cy="18" r="2.4" fill="#d9c4f2" stroke="none"/>
  </g>
</svg>
