    <path d="M92 34 Q90 24 94 18" fill="none" stroke-width="3"/>
    <path d="M94 22 Q104 12 110 18 Q104 26 94 22 Z" fill="#7d9a5a" stroke-width="2.4"/>
    <circle cx="36" cy="70" r="2.2" fill="#d6fff7" stroke="none"/>
    <circle cx="80" cy="76" r="2.2" fill="#d6fff7" stroke="none"/>
