<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Errante Esporado: élite lento y robusto; lleva una colonia de esporas en la espalda -->
  <defs>
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b98cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b98cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- halo violeta de esporas -->
  <ellipse cx="64" cy="48" rx="58" ry="44" fill="url(#glow)"/>
  <ellipse cx="64" cy="114" rx="42" ry="8" fill="#000" opacity="0.35"/>
  <g filter="url(#wob)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- patas cortas -->
    <path d="M36 98 Q32 110 40 112 Q48 112 48 100 Z M80 100 Q80 112 88 112 Q96 110 92 98 Z" fill="#4a3d4f"/>
    <!-- cuerpo encorvado -->
    <path d="M18 80 Q16 46 52 40 Q96 34 110 66 Q116 92 92 102 Q64 110 36 102 Q18 96 18 80 Z" fill="#5d4f63"/>
    <path d="M92 44 Q114 58 110 82 Q104 100 84 104 Q104 84 92 44 Z" fill="#4a3d4f" stroke="none"/>
    <!-- musgo -->
    <path d="M26 70 Q30 60 40 64 Q36 74 26 70 Z M96 86 Q104 82 106 90 Q100 94 96 86 Z" fill="#5a7040" stroke-width="2.4"/>
    <!-- colonia de setas en la espalda -->
    <path d="M42 46 L44 30 M64 40 L64 20 M86 46 L88 30" fill="none" stroke-width="5"/>
    <path d="M42 46 L44 30 M64 40 L64 20 M86 46 L88 30" fill="none" stroke="#e9dcc8" stroke-width="2"/>
    <path d="M30 32 Q32 18 44 18 Q58 20 56 32 Q44 36 30 32 Z" fill="#8a5fc4"/>
    <path d="M50 22 Q50 4 64 4 Q78 4 78 22 Q64 28 50 22 Z" fill="#9b6fd6"/>
    <path d="M74 32 Q74 18 88 18 Q100 20 100 32 Q88 36 74 32 Z" fill="#8a5fc4"/>
    <circle cx="40" cy="25" r="3" fill="#e2d2ff" stroke="none"/>
    <circle cx="60" cy="12" r="3.4" fill="#e2d2ff" stroke="none"/>
    <circle cx="70" cy="16" r="2.4" fill="#e2d2ff" stroke="none"/>
    <circle cx="90" cy="25" r="3" fill="#e2d2ff" stroke="none"/>
    <!-- esporas sueltas -->
    <circle cx="20" cy="40" r="3.4" fill="#b98cff" stroke-width="2"/>
    <circle cx="108" cy="36" r="3" fill="#b98cff" stroke-width="2"/>
    <circle cx="112" cy="52" r="2.4" fill="#b98cff" stroke-width="1.6"/>
    <!-- cara -->
    <path d="M24 84 Q24 64 46 64 Q66 66 66 84 Q64 100 44 100 Q24 100 24 84 Z" fill="#6e6075"/>
    <ellipse cx="38" cy="82" rx="6.5" ry="7.5" fill="#fff"/>
    <ellipse cx="54" cy="82" rx="6.5" ry="7.5" fill="#fff"/>
    <circle cx="39" cy="84" r="3.8" fill="#4a1f7a" stroke="none"/>
    <circle cx="53" cy="84" r="3.8" fill="#4a1f7a" stroke="none"/>
    <circle cx="38" cy="82" r="1.3" fill="#fff" stroke="none"/>
    <circle cx="52" cy="82" r="1.3" fill="#fff" stroke="none"/>
    <path d="M30 72 L42 76 M62 72 L50 76" fill="none" stroke-width="2.6"/>
    <path d="M40 94 Q46 90 52 94" fill="none" stroke-width="2.4"/>
  </g>
</svg>
