    <path d="M102 76 Q94 86 72 80 Q88 82 102 76 Z" fill="#55703f" stroke="none"/>
    <path d="M32 74 Q46 70 58 76 M96 74 Q82 70 70 76" fill="none" stroke-width="2" stroke="#d6f0a8"/>
