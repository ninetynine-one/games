    <path d="M60 78 Q62 64 62 54 H66 Q66 64 68 78 Z" fill="#a8764a"/>
    <!-- sépalos -->
    <path d="M64 62 Q50 62 46 52 Q56 54 64 60 Z M64 62 Q78 62 82 52 Q72 54 64 60 Z" fill="#6f9a48" stroke-width="2.6"/>
