<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Cáliz de Rocío: parterre vegetal + cáliz de pétalos bruma con una gran gota de rocío turquesa -->
  <defs>
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ff0e0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7ff0e0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- resplandor turquesa -->
  <circle cx="64" cy="40" r="40" fill="url(#halo)"/>
  <g filter="url(#wob)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- parterre vegetal: montículo de tierra viva con borde de musgo, tréboles y guijarros (sustituye al macetero) -->
