    <path d="M10 90 Q6 80 16 76 Q22 84 20 92 Z" fill="#7fae4e"/>
    <path d="M118 90 Q122 80 112 76 Q106 84 108 92 Z" fill="#7fae4e"/>
    <path d="M26 100 Q20 94 26 88 Q32 92 32 100 Z" fill="#9cc45a"/>
    <path d="M96 102 Q102 94 108 98 Q104 106 96 104 Z" fill="#9cc45a"/>
    <path d="M44 106 Q40 100 46 96 Q52 100 50 106 Z" fill="#6f9a48"/>
    <path d="M78 106 Q82 98 88 100 Q86 108 78 108 Z" fill="#6f9a48"/>
    <circle cx="60" cy="104" r="3.2" fill="#d8ccb0" stroke-width="2"/>
    <circle cx="112" cy="70" r="2.4" fill="#f2ead6" stroke="none"/><circle cx="16" cy="66" r="2" fill="#f6d27a" stroke="none"/>
    <!-- hojas redondas -->
    <path d="M62 78 Q40 90 24 78 Q22 62 42 62 Q60 64 62 78 Z" fill="#7fae4e"/>
    <path d="M66 78 Q88 90 104 78 Q106 62 86 62 Q68 64 66 78 Z" fill="#7fae4e"/>
