<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Vencejo de Corriente: aéreo y veloz; cuerpo esbelto azul oscuro, alas de hoz, garganta blanca, cola bífida -->
  <defs>
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="52"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="118" rx="20" ry="5" fill="#000" opacity="0.28"/>
  <g filter="url(#wob)" stroke="#12192b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- cola bífida -->
    <path d="M58 88 L40 120 L60 106 L64 112 L68 106 L88 120 L70 88 Z" fill="#26365e"/>
    <!-- alas en hoz, barridas hacia atrás -->
    <path d="M54 52 Q30 36 6 52 Q-2 56 12 58 Q34 62 54 74 Z" fill="#33477a"/>
    <path d="M74 52 Q98 36 122 52 Q130 56 116 58 Q94 62 74 74 Z" fill="#33477a"/>
    <path d="M14 54 Q34 54 52 66 M114 54 Q94 54 76 66" fill="none" stroke-width="2" stroke="#12192b"/>
    <!-- cuerpo esbelto -->
    <path d="M64 24 Q80 28 78 52 Q78 78 64 96 Q50 78 50 52 Q48 28 64 24 Z" fill="#2c3d6b"/>
    <path d="M70 30 Q80 38 76 58 Q74 78 66 92 Q72 66 70 30 Z" fill="#1f2c50" stroke="none"/>
    <!-- garganta blanca -->
    <path d="M54 46 Q64 54 74 46 Q74 60 64 66 Q54 60 54 46 Z" fill="#f2efe6" stroke-width="2.4"/>
    <!-- pico y ojos -->
    <path d="M60 28 L64 20 L68 28 Z" fill="#e8b84a" stroke-width="2.4"/>
    <circle cx="58" cy="36" r="5" fill="#12192b"/>
    <circle cx="70" cy="36" r="5" fill="#12192b"/>
    <circle cx="57" cy="34.5" r="1.8" fill="#f2efe6" stroke="none"/>
    <circle cx="69" cy="34.5" r="1.8" fill="#f2efe6" stroke="none"/>
  </g>
</svg>
