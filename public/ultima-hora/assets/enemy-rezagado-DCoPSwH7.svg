<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Rezagado: weary hooded passenger, forever late, with a suitcase. Faces left. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
  </defs>
  <ellipse cx="62" cy="113" rx="32" ry="6" fill="#000" opacity="0.3"/>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- suitcase -->
    <path d="M26 84 Q26 78 30 78 L34 78" fill="none" stroke-width="3"/>
    <rect x="14" y="82" width="26" height="22" rx="3" fill="#7a5232"/>
    <path d="M14 96 L40 96" stroke-width="2.4"/>
    <rect x="22" y="88" width="10" height="4" fill="#d4a640" stroke-width="2"/>
    <!-- body / cloak -->
    <path d="M36 108 Q28 72 44 54 Q64 36 84 54 Q100 72 94 108 L86 104 L80 110 L72 104 L64 110 L56 104 L48 110 L42 104 Z" fill="#6f7b8e"/>
    <path d="M84 54 Q100 72 94 108 L86 104 L80 110 Q86 80 78 56 Z" fill="#59647a" stroke="none"/>
    <path d="M36 108 Q28 72 44 54 Q64 36 84 54 Q100 72 94 108 L86 104 L80 110 L72 104 L64 110 L56 104 L48 110 L42 104 Z" fill="none"/>
    <!-- arm to suitcase -->
    <path d="M44 80 Q36 82 34 80" fill="none" stroke-width="3"/>
    <circle cx="35" cy="80" r="5" fill="#59647a" stroke-width="2.8"/>
    <!-- cap -->
    <path d="M40 56 Q46 34 70 34 Q90 38 90 54 Q64 46 40 56 Z" fill="#5a4636"/>
    <path d="M28 60 Q34 50 52 51 L50 57 Q38 57 28 60 Z" fill="#43342a"/>
    <!-- eyes, heavy-lidded -->
    <ellipse cx="55" cy="70" rx="9" ry="10" fill="#e8e4d8" stroke-width="3"/>
    <ellipse cx="76" cy="70" rx="8" ry="9.5" fill="#e8e4d8" stroke-width="3"/>
    <path d="M46 67 Q55 62 64 67 L64 62 Q55 58 46 63 Z" fill="#6f7b8e" stroke-width="2.6"/>
    <path d="M68 67 Q76 62 84 67 L84 62 Q76 58 68 63 Z" fill="#6f7b8e" stroke-width="2.6"/>
    <circle cx="52" cy="73" r="3.4" fill="#c8463a" stroke-width="1.4"/>
    <circle cx="73" cy="73" r="3.2" fill="#c8463a" stroke-width="1.4"/>
    <path d="M60 87 Q64 84 68 87" fill="none" stroke-width="2.6"/>
    <!-- cracked pocket watch on a chain -->
    <path d="M70 90 Q76 96 80 94" fill="none" stroke="#d4a640" stroke-width="2"/>
    <circle cx="82" cy="96" r="7" fill="#ece2c6" stroke-width="2.6"/>
    <path d="M82 96 L82 91.5 M79 93 L84 99" fill="none" stroke-width="1.6"/>
  </g>
  <circle cx="50.8" cy="71.8" r="1.1" fill="#fff"/>
  <circle cx="71.8" cy="71.8" r="1.1" fill="#fff"/>
</svg>
