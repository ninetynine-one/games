      <stop offset="0" stop-color="#f4f0ff" stop-opacity="0.38"/>
      <stop offset="0.3" stop-color="#d8d0f0" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#d8d0f0" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#b8b0e0" stop-opacity="0"/>
    </radialGradient>
