<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Llave de desmontar: big brass wrench crossed with a slate crowbar. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="44"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
  </defs>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- crowbar (behind) -->
    <g transform="rotate(40 64 64)">
      <path d="M64 112 L64 30 Q64 12 46 14 L42 20" fill="none" stroke-width="14"/>
      <path d="M64 112 L64 30 Q64 12 46 14 L42 20" fill="none" stroke="#5d6a86" stroke-width="7"/>
