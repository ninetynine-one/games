      <path d="M58 112 L70 112 L64 122 Z" fill="#5d6a86" stroke-width="3"/>
    </g>
    <!-- wrench -->
    <g transform="rotate(-42 64 64)">
      <rect x="56" y="40" width="16" height="62" rx="4" fill="#d0a24c"/>
      <rect x="64" y="42" width="8" height="58" fill="#a07a40" stroke="none"/>
      <rect x="56" y="40" width="16" height="62" rx="4" fill="none"/>
      <path d="M46 44 L42 22 L52 8 L56 24 L72 24 L76 8 L86 22 L82 44 Z" fill="#d0a24c"/>
      <path d="M72 24 L76 8 L86 22 L82 44 L70 44 Z" fill="#a07a40" stroke="none"/>
      <path d="M46 44 L42 22 L52 8 L56 24 L72 24 L76 8 L86 22 L82 44 Z" fill="none"/>
      <circle cx="64" cy="108" r="13" fill="#d0a24c"/>
      <circle cx="64" cy="108" r="5.5" fill="#1b1714" stroke-width="2"/>
      <path d="M60 60 L68 60 M60 70 L68 70 M60 80 L68 80" fill="none" stroke-width="2.2"/>
    </g>
  </g>
  <path d="M38 40 L52 26" fill="none" stroke="#fff3c4" stroke-width="3" stroke-linecap="round"/>
</svg>
