<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Demoler anden: sledgehammer smashing a wooden crate, with an impact burst and flying debris. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="48"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
  </defs>
  <ellipse cx="52" cy="114" rx="34" ry="6" fill="#000" opacity="0.3"/>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- impact burst -->
    <path d="M44 34 L52 46 L64 36 L64 50 L78 50 L68 58 L40 58 L30 48 L42 48 Z" fill="#f0b43c" stroke-width="3"/>
    <!-- crate -->
    <path d="M18 60 L44 56 L52 64 L60 56 L84 60 L84 110 L18 110 Z" fill="#a8703c"/>
    <path d="M70 58 L84 60 L84 110 L70 110 Z" fill="#7a5232" stroke="none"/>
    <path d="M18 60 L44 56 L52 64 L60 56 L84 60 L84 110 L18 110 Z" fill="none"/>
    <path d="M18 72 L84 72 M18 98 L84 98" fill="none" stroke-width="3"/>
    <path d="M22 98 L80 72" fill="none" stroke-width="7"/>
    <path d="M22 98 L80 72" fill="none" stroke="#c88a4c" stroke-width="3"/>
    <path d="M52 64 L48 76 L54 84 L50 94" fill="none" stroke-width="2.8"/>
    <!-- hammer -->
    <g transform="translate(64 40) rotate(-38)">
      <rect x="10" y="-5" width="44" height="10" rx="3" fill="#8a5a32"/>
      <rect x="46" y="-6" width="14" height="12" rx="3" fill="#5e3e25" stroke-width="3"/>
      <rect x="-14" y="-20" width="28" height="40" rx="4" fill="#5d6a86"/>
      <rect x="2" y="-18" width="10" height="36" fill="#3e4658" stroke="none"/>
      <rect x="-14" y="-20" width="28" height="40" rx="4" fill="none"/>
      <path d="M-14 -10 L14 -10 M-14 10 L14 10" fill="none" stroke-width="2.4"/>
    </g>
    <!-- debris -->
    <path d="M14 36 L24 32 L26 42 L16 44 Z" fill="#a8703c" stroke-width="3"/>
    <path d="M8 56 L14 52 L16 60 Z" fill="#c88a4c" stroke-width="2.6"/>
    <path d="M90 66 L100 62 L104 72 L94 74 Z" fill="#a8703c" stroke-width="3"/>
    <path d="M100 88 L108 86 L106 94 Z" fill="#c88a4c" stroke-width="2.6"/>
  </g>
  <path d="M24 66 L40 64" fill="none" stroke="#f3e6c4" stroke-opacity="0.7" stroke-width="2.6" stroke-linecap="round"/>
</svg>
