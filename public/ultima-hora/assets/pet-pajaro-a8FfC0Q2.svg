<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Pet pajaro: wind-up clockwork bird in brass with a winding key on its back, facing right. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="42"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
  </defs>
  <ellipse cx="62" cy="114" rx="28" ry="6" fill="#000" opacity="0.3"/>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- legs -->
    <path d="M54 90 L52 108 M52 108 L46 110 M52 108 L58 110" fill="none" stroke-width="6.5"/>
    <path d="M54 90 L52 108 M52 108 L46 110 M52 108 L58 110" fill="none" stroke="#3e4658" stroke-width="2.6"/>
    <path d="M70 90 L72 108 M72 108 L66 110 M72 108 L78 110" fill="none" stroke-width="6.5"/>
    <path d="M70 90 L72 108 M72 108 L66 110 M72 108 L78 110" fill="none" stroke="#3e4658" stroke-width="2.6"/>
    <!-- tail -->
    <path d="M34 70 L10 56 L14 68 L6 74 L16 80 L12 90 L36 82 Z" fill="#a07a40"/>
    <!-- key on back -->
    <rect x="45" y="34" width="7" height="18" fill="#8a6a3a" stroke-width="2.8"/>
    <ellipse cx="40" cy="28" rx="9" ry="6.5" fill="#e0b24a" stroke-width="2.8" transform="rotate(-15 40 28)"/>
    <ellipse cx="57" cy="28" rx="9" ry="6.5" fill="#e0b24a" stroke-width="2.8" transform="rotate(15 57 28)"/>
    <circle cx="48.5" cy="30" r="4" fill="#b08a4a" stroke-width="2.4"/>
    <!-- body -->
    <ellipse cx="60" cy="72" rx="30" ry="22" fill="#d0a24c"/>
    <path d="M60 94 Q86 92 90 72 Q90 88 76 94 Z" fill="#a07a40" stroke="none"/>
    <ellipse cx="60" cy="72" rx="30" ry="22" fill="none"/>
    <!-- head -->
    <circle cx="86" cy="50" r="18" fill="#d0a24c"/>
    <!-- beak -->
    <path d="M102 46 L120 52 L102 58 Z" fill="#f0b43c"/>
    <!-- wing with gear -->
    <path d="M40 66 Q58 58 74 70 Q66 86 44 84 Q36 76 40 66 Z" fill="#a07a40" stroke-width="3"/>
    <circle cx="56" cy="74" r="6" fill="#d0a24c" stroke-width="2.4" stroke-dasharray="3 2"/>
    <circle cx="56" cy="74" r="2" fill="#1b1714" stroke="none"/>
    <!-- eye -->
    <circle cx="90" cy="48" r="7.5" fill="#f3e6c4" stroke-width="2.6"/>
    <circle cx="92" cy="48" r="4.5" fill="#1b1714" stroke="none"/>
  </g>
  <circle cx="93.5" cy="46.5" r="1.8" fill="#fff"/>
  <ellipse cx="84" cy="60" rx="4" ry="2.5" fill="#e39a8a" opacity="0.7"/>
  <path d="M38 64 Q44 56 54 54" fill="none" stroke="#fff3c4" stroke-width="3" stroke-linecap="round"/>
  <path d="M76 40 Q80 35 86 34" fill="none" stroke="#fff3c4" stroke-width="2.6" stroke-linecap="round"/>
</svg>
