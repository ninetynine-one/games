<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Cartografo de eras: chibi explorer with a wide-brim hat, map roll on the back, vest and pocket watch at the belt. Body only: the tool is a separate layer (tool-*.svg) held at HAND. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>
  <g stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <g filter="url(#rough)">
      <!-- map roll on the back -->
      <g transform="translate(40 78) rotate(-28)">
        <rect x="-7" y="-34" width="14" height="54" rx="3" fill="#ecdcb4"/>
        <ellipse cx="0" cy="-34" rx="7" ry="3.2" fill="#d2b47e"/>
        <path d="M-7 -14 L7 -14" stroke="#8a3a2a" stroke-width="3"/>
      </g>
      <!-- legs and boots -->
      <rect x="51" y="95" width="10" height="13" rx="3" fill="#6b4a2e"/>
      <rect x="67" y="95" width="10" height="13" rx="3" fill="#6b4a2e"/>
      <ellipse cx="55" cy="109.5" rx="8" ry="4.5" fill="#3a2a1e"/>
      <ellipse cx="73" cy="109.5" rx="8" ry="4.5" fill="#3a2a1e"/>
      <!-- shirt, vest, belt -->
      <path d="M46 100 Q44 78 54 69 L74 69 Q84 78 82 100 Q64 104 46 100 Z" fill="#e6d2a8"/>
      <path d="M47 99 Q45 80 54 70 L60 70 L60 100 Q53 101 47 99 Z" fill="#b07c42"/>
      <path d="M68 70 L74 70 Q83 80 81 99 Q75 101 68 100 Z" fill="#9a6a38"/>
      <path d="M56 69 L72 69 L64 79 Z" fill="#8a3a2a" stroke-width="2.6"/>
      <rect x="46" y="90" width="36" height="6" rx="2" fill="#4a3020" stroke-width="2.6"/>
      <rect x="60" y="89" width="8" height="8" rx="1.5" fill="#f0b43c" stroke-width="2.4"/>
      <!-- pocket watch on its chain -->
      <path d="M68 94 Q70 99 74 98" fill="none" stroke="#f0b43c" stroke-width="2"/>
      <circle cx="77" cy="100" r="6" fill="#f0b43c" stroke-width="2.6"/>
      <circle cx="77" cy="100" r="3.4" fill="#f6ecd0" stroke-width="1.6"/>
      <path d="M77 100 L77 97.8 M77 100 L78.6 100.8" stroke-width="1.2"/>
      <!-- arms -->
      <path d="M51 73 Q40 79 39 89 L46 91 Q48 84 55 80 Z" fill="#e6d2a8"/>
      <circle cx="42" cy="91" r="5.5" fill="#f0d4ac" stroke-width="3"/>
      <path d="M77 73 Q88 77 91 85 L85 89 Q81 83 73 80 Z" fill="#e6d2a8"/>
    </g>
    <circle cx="64" cy="46" r="23" fill="#f0d4ac"/>
    <path d="M84 56 Q78 68 62 69 Q80 72 86.5 58 Z" fill="#dcb88c" stroke="none"/>
    <circle cx="64" cy="46" r="23" fill="none"/>
    <path d="M42 38 Q35 47 42 58 Q47 51 47 41 Z" fill="#4a3020"/>
    <path d="M86 38 Q92 46 87 54 Q83 47 83 40 Z" fill="#4a3020"/>
    <ellipse cx="58" cy="51" rx="3.8" ry="4.8" fill="#1b1714" stroke="none"/>
    <ellipse cx="73" cy="51" rx="3.8" ry="4.8" fill="#1b1714" stroke="none"/>
    <circle cx="59.3" cy="49.3" r="1.5" fill="#fff" stroke="none"/>
    <circle cx="74.3" cy="49.3" r="1.5" fill="#fff" stroke="none"/>
    <ellipse cx="51" cy="59" rx="4.5" ry="2.6" fill="#e39a8a" opacity="0.65" stroke="none"/>
    <ellipse cx="80" cy="59" rx="4.5" ry="2.6" fill="#e39a8a" opacity="0.65" stroke="none"/>
    <path d="M63 61 Q66.5 64.5 70 61" fill="none" stroke-width="2.4"/>
    <g filter="url(#rough)">
      <!-- wide-brim hat -->
      <path d="M44 33 Q43 10 64 9 Q85 10 84 33 Z" fill="#8a6238"/>
      <path d="M72 12 Q84 14 84 33 L78 33 Q79 18 72 12 Z" fill="#6e4c2a" stroke="none"/>
      <path d="M44 33 Q43 10 64 9 Q85 10 84 33" fill="none"/>
      <path d="M44 27 Q64 23 84 27 L84 33 Q64 29 44 33 Z" fill="#5a3a22" stroke-width="2.8"/>
      <rect x="71" y="24" width="7" height="7" rx="1" fill="#f0b43c" stroke-width="2.2"/>
      <path d="M18 37 Q22 28 44 30 Q64 27 84 30 Q106 28 110 37 Q104 43 84 38 Q64 35 44 38 Q24 43 18 37 Z" fill="#9a7040"/>
    </g>
    <circle cx="90" cy="88" r="5.5" fill="#f0d4ac" stroke-width="3"/>
  </g>
</svg>
