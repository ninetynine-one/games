<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Hora prestada: brass hourglass wrapped in an icy cyan ribbon, with icicles and frost. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
  </defs>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- back ribbon band -->
    <path d="M14 70 L30 62 L32 76 L18 84 Z M98 50 L114 44 L114 58 L100 64 Z" fill="#2f9fbc"/>
    <!-- glass and frozen sand -->
    <path d="M42 22 C42 42 56 50 58 62 C56 74 42 82 42 104 L86 104 C86 82 72 74 70 62 C72 50 86 42 86 22 Z" fill="#bfeaf2"/>
    <path d="M46 34 Q64 39 82 34 C80 46 68 52 64 58 C60 52 48 46 46 34 Z" fill="#f0b43c" stroke-width="2.4"/>
    <path d="M44 103 Q64 86 84 103 Z" fill="#f0b43c" stroke-width="2.4"/>
    <path d="M42 22 C42 42 56 50 58 62 C56 74 42 82 42 104 L86 104 C86 82 72 74 70 62 C72 50 86 42 86 22 Z" fill="none"/>
    <!-- frame -->
    <path d="M32 12 L96 12 L96 23 L32 23 Z M32 103 L96 103 L96 114 L32 114 Z" fill="#b08a4a"/>
    <!-- icicles -->
    <path d="M40 23 L44 34 L48 23 M54 23 L57 30 L60 23 M70 23 L73 32 L76 23 M82 23 L85 30 L88 23" fill="#dff7fb" stroke-width="2.4"/>
    <!-- front ribbon band -->
    <path d="M22 66 L106 48 L108 62 L24 80 Z" fill="#52d3ee"/>
    <path d="M26 72 L104 55" fill="none" stroke="#bff3fb" stroke-width="2.4"/>
    <!-- frozen clock knot -->
    <circle cx="64" cy="64" r="12" fill="#dff7fb" stroke-width="3"/>
    <path d="M64 64 L64 56 M64 64 L70 67" fill="none" stroke-width="2.6"/>
  </g>
  <!-- snowflake -->
  <g stroke="#1b1714" stroke-width="6" stroke-linecap="round">
    <path d="M110 6 L110 30 M99.6 12 L120.4 24 M99.6 24 L120.4 12"/>
  </g>
  <g stroke="#dff7fb" stroke-width="2.6" stroke-linecap="round">
    <path d="M110 6 L110 30 M99.6 12 L120.4 24 M99.6 24 L120.4 12"/>
  </g>
  <path d="M48 27 C48 36 51 41 53 44" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>
</svg>
