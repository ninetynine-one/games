<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Cosmetic core «Latón pulido»: the clock core in polished brass on a walnut plinth, cream glow. Same frame and anchor as core-nucleo-reloj. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#f0d08a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f0d08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="52" r="64" fill="url(#glow)"/>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- walnut plinth -->
    <path d="M18 100 Q20 88 64 86 Q108 88 110 100 L110 109 Q64 121 18 109 Z" fill="#4a2c1a"/>
    <ellipse cx="64" cy="97" rx="45" ry="10" fill="#7a4a2c"/>
    <path d="M30 101 Q64 110 98 101" fill="none" stroke="#5e3820" stroke-width="3"/>
    <!-- struts -->
    <path d="M46 96 L52 78 L59 78 L55 96 Z M82 96 L76 78 L69 78 L73 96 Z" fill="#c89c52" stroke-width="2.8"/>
    <!-- side gears -->
    <circle cx="26" cy="100" r="11" fill="#e0b24a" stroke-width="2.6" stroke-dasharray="5 2.4"/>
    <circle cx="26" cy="100" r="3.5" fill="#1b1714" stroke-width="1"/>
    <circle cx="102" cy="102" r="10" fill="#c69a50" stroke-width="2.6" stroke-dasharray="5 2.4"/>
    <circle cx="102" cy="102" r="3" fill="#1b1714" stroke-width="1"/>
    <!-- crown knob -->
    <circle cx="64" cy="13" r="6" fill="#efcf8a" stroke-width="3"/>
    <rect x="59" y="15" width="10" height="5" fill="#c89c52" stroke-width="2.6"/>
    <!-- clock: fluted brass bezel -->
    <circle cx="64" cy="52" r="35" fill="#e0b24a"/>
    <circle cx="64" cy="52" r="31" fill="none" stroke="#a97e2a" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M95 40 Q104 66 80 84 Q64 92 46 86 Q74 86 88 64 Q96 52 95 40 Z" fill="#a97e2a" stroke="none"/>
    <circle cx="64" cy="52" r="35" fill="none"/>
    <circle cx="64" cy="52" r="26" fill="#f6ecd2" stroke-width="3"/>
    <path d="M86 40 Q94 62 76 74 Q64 80 52 77 Q72 74 82 60 Q88 50 86 40 Z" fill="#e2d4ae" stroke="none"/>
    <g stroke-width="2.6">
      <path d="M64 28 v6 M64 70 v6 M40 52 h6 M82 52 h6"/>
      <path d="M76 31.2 l-1.5 2.6 M84.8 40 l-2.6 1.5 M84.8 64 l-2.6 -1.5 M76 72.8 l-1.5 -2.6 M52 72.8 l1.5 -2.6 M43.2 64 l2.6 -1.5 M43.2 40 l2.6 1.5 M52 31.2 l1.5 2.6" stroke-width="2"/>
    </g>
    <!-- hands: 11:59 -->
    <path d="M64 52 L52 37" stroke-width="5"/>
    <path d="M64 52 L52 37" stroke="#7a4a2c" stroke-width="2"/>
    <path d="M64 52 L62 29" stroke-width="4"/>
    <circle cx="64" cy="52" r="5.5" fill="#efcf8a" stroke-width="2.8"/>
  </g>
  <path d="M40 30 Q48 22 60 21" fill="none" stroke="#fff3c4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="62.6" cy="50.6" r="1.6" fill="#ffffff"/>
</svg>
