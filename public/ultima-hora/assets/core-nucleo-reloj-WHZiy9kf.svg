<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Núcleo del gran reloj: the clock core, stopped a minute before the hour. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7fe6f2" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#5fd4e6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5fd4e6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="52" r="64" fill="url(#glow)"/>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- stone plinth -->
    <path d="M18 100 Q20 88 64 86 Q108 88 110 100 L110 109 Q64 121 18 109 Z" fill="#33343c"/>
    <ellipse cx="64" cy="97" rx="45" ry="10" fill="#55565f"/>
    <path d="M30 101 Q64 110 98 101" fill="none" stroke="#45464f" stroke-width="3"/>
    <!-- struts -->
    <path d="M46 96 L52 78 L59 78 L55 96 Z M82 96 L76 78 L69 78 L73 96 Z" fill="#8a6a3a" stroke-width="2.8"/>
    <!-- side gears -->
