    <circle cx="26" cy="100" r="3.5" fill="#1b1714" stroke-width="1"/>
    <path d="M110.5 102.0 L113.6 105.1 L112.4 108.0 L108.0 108.0 L106.2 109.4 L105.1 113.6 L102.0 114.0 L99.8 110.2 L97.8 109.4 L93.5 110.5 L91.6 108.0 L93.8 104.2 L93.5 102.0 L90.4 98.9 L91.6 96.0 L96.0 96.0 L97.8 94.6 L98.9 90.4 L102.0 90.0 L104.2 93.8 L106.2 94.6 L110.5 93.5 L112.4 96.0 L110.2 99.8 Z" fill="#9c7a42" stroke-width="2.6"/>
    <circle cx="102" cy="102" r="3" fill="#1b1714" stroke-width="1"/>
    <!-- crown knob -->
    <circle cx="64" cy="13" r="6" fill="#d4a640" stroke-width="3"/>
    <rect x="59" y="15" width="10" height="5" fill="#8a6a3a" stroke-width="2.6"/>
    <!-- clock -->
    <circle cx="64" cy="52" r="35" fill="#c69a50"/>
    <path d="M95 40 Q104 66 80 84 Q64 92 46 86 Q74 86 88 64 Q96 52 95 40 Z" fill="#8a6a3a" stroke="none"/>
    <circle cx="64" cy="52" r="35" fill="none"/>
    <circle cx="64" cy="52" r="27" fill="#ece2c6" stroke-width="3"/>
    <path d="M86 40 Q94 62 76 74 Q64 80 52 77 Q72 74 82 60 Q88 50 86 40 Z" fill="#d6c79f" stroke="none"/>
    <g stroke-width="2.6">
      <path d="M64 28 v5 M64 71 v5 M40 52 h5 M83 52 h5"/>
      <path d="M76 31.2 l-1.5 2.6 M84.8 40 l-2.6 1.5 M84.8 64 l-2.6 -1.5 M76 72.8 l-1.5 -2.6 M52 72.8 l1.5 -2.6 M43.2 64 l2.6 -1.5 M43.2 40 l2.6 1.5 M52 31.2 l1.5 2.6" stroke-width="2"/>
    </g>
    <!-- hands: 11:59 -->
    <path d="M64 52 L52 37" stroke-width="5"/>
    <path d="M64 52 L52 37" stroke="#2e3266" stroke-width="2"/>
    <path d="M64 52 L62 29" stroke-width="4"/>
    <path d="M70 39 L78 44 L76 52" fill="none" stroke-width="1.5"/>
    <circle cx="64" cy="52" r="5.5" fill="#5fd4e6" stroke-width="2.8"/>
  </g>
  <circle cx="62.6" cy="50.6" r="1.6" fill="#ffffff"/>
  <!-- drifting time sparks -->
  <g fill="#a8f0f7" stroke="#1b1714" stroke-width="1.5" stroke-linejoin="round">
    <path d="M22 26 L25 31 L22 36 L19 31 Z"/>
    <path d="M106 20 L108.5 24 L106 28 L103.5 24 Z"/>
    <path d="M108 60 L110 63 L108 66 L106 63 Z"/>
  </g>
</svg>
