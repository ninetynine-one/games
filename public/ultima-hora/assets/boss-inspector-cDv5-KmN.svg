<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Inspector de las Horas: a pocket-watch head under a conductor cap, sanction stamp and red lantern. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="12"/>
      <feDisplacementMap in="SourceGraphic" scale="3.4"/>
    </filter>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#ff6a4a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff6a4a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="238" rx="78" ry="12" fill="#000" opacity="0.35"/>
  <circle cx="218" cy="188" r="34" fill="url(#lamp)"/>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- coat -->
    <path d="M72 128 Q60 182 50 230 L76 224 L92 234 L128 228 L164 234 L180 224 L206 230 Q196 182 184 128 Q128 112 72 128 Z" fill="#2b2d55"/>
    <path d="M150 122 Q184 128 184 128 Q196 182 206 230 L180 224 L164 234 Q172 180 150 122 Z" fill="#202247" stroke="none"/>
    <path d="M72 128 Q60 182 50 230 L76 224 L92 234 L128 228 L164 234 L180 224 L206 230 Q196 182 184 128 Q128 112 72 128 Z" fill="none"/>
    <path d="M128 132 L128 226" stroke-width="4"/>
    <g fill="#d4a640" stroke-width="3">
