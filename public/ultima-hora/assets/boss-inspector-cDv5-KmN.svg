    <path d="M78 60 Q128 80 178 60 L172 70 Q128 86 84 70 Z" fill="#15162c" stroke-width="5"/>
    <!-- badge -->
    <path d="M118 24 L138 24 L128 36 L138 48 L118 48 L128 36 Z" fill="#e0b24a" stroke-width="3.5"/>
  </g>
  <circle cx="122" cy="101" r="2.4" fill="#fff"/>
</svg>
