    <path d="M160 82 Q170 112 146 126 Q130 134 112 130 Q142 124 154 104 Q160 94 160 82 Z" fill="#cfc19a" stroke="none"/>
    <g stroke-width="3.5">
      <path d="M90 98 h7 M159 98 h7 M128 129 v7 M101 125 l4 -4 M155 125 l-4 -4"/>
    </g>
    <!-- frozen hands behind the eye -->
    <path d="M128 100 L128 70 M128 100 L108 84" stroke-width="5"/>
    <!-- red eye -->
    <ellipse cx="128" cy="104" rx="17" ry="14" fill="#f2ead6" stroke-width="4.5"/>
    <circle cx="126" cy="105" r="10" fill="#c8463a" stroke-width="3.5"/>
    <ellipse cx="126" cy="105" rx="3" ry="7" fill="#1b1714" stroke-width="1"/>
    <path d="M106 90 L150 96" stroke-width="5"/>
