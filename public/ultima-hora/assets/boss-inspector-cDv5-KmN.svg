    </g>
    <!-- collar -->
    <path d="M92 124 L128 140 L164 124 L160 114 L96 114 Z" fill="#3a3d6e" stroke-width="5"/>
    <path d="M92 124 L128 140 L164 124" fill="none" stroke="#d4a640" stroke-width="3"/>
    <!-- epaulettes -->
    <path d="M60 132 Q66 118 86 122 L82 138 Q70 140 60 132 Z" fill="#d4a640" stroke-width="5"/>
    <path d="M196 132 Q190 118 170 122 L174 138 Q186 140 196 132 Z" fill="#d4a640" stroke-width="5"/>
    <!-- left arm + sanction stamp -->
    <path d="M66 136 Q48 156 46 178 L62 182 Q64 162 80 148 Z" fill="#2b2d55" stroke-width="5"/>
    <rect x="44" y="164" width="14" height="22" rx="4" fill="#5a3e2a" stroke-width="4.5"/>
    <circle cx="51" cy="160" r="9" fill="#5a3e2a" stroke-width="4.5"/>
    <path d="M24 186 L80 186 L80 206 L24 206 Z" fill="#b8433a" stroke-width="5"/>
    <path d="M24 200 L80 200 L80 206 L24 206 Z" fill="#7a2a24" stroke="none"/>
    <path d="M24 186 L80 186 L80 206 L24 206 Z" fill="none" stroke-width="5"/>
    <!-- right arm + lantern -->
    <path d="M190 136 Q210 150 216 166 L202 172 Q194 158 176 148 Z" fill="#2b2d55" stroke-width="5"/>
    <path d="M210 160 Q218 150 226 160" fill="none" stroke-width="4"/>
    <path d="M204 168 L232 168 L230 206 L206 206 Z" fill="#e0503c" stroke-width="5"/>
    <path d="M211 172 L225 172 L224 200 L212 200 Z" fill="#ffb08a" stroke="none"/>
    <path d="M218 168 L218 206 M204 168 L232 168 L230 206 L206 206 Z" fill="none" stroke-width="4"/>
    <path d="M200 166 L236 166 L236 172 L200 172 Z M202 204 L234 204 L234 212 L202 212 Z" fill="#8a6a3a" stroke-width="4"/>
    <!-- watch head -->
    <circle cx="128" cy="96" r="48" fill="#c69a50"/>
    <path d="M170 76 Q184 120 146 140 Q120 148 98 136 Q140 134 160 104 Q170 90 170 76 Z" fill="#8a6a3a" stroke="none"/>
    <circle cx="128" cy="96" r="48" fill="none"/>
