<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Relojera de estacion: chibi station master with a peaked cap, blue jacket, whistle and a key ring of little clocks. Body only: the tool is a separate layer (tool-*.svg) held at HAND. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>
  <g stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <g filter="url(#rough)">
      <!-- legs and shoes -->
      <rect x="52" y="96" width="9" height="12" rx="3" fill="#1e2240"/>
      <rect x="67" y="96" width="9" height="12" rx="3" fill="#1e2240"/>
      <ellipse cx="55" cy="109.5" rx="7.5" ry="4.2" fill="#14121c"/>
      <ellipse cx="73" cy="109.5" rx="7.5" ry="4.2" fill="#14121c"/>
      <!-- skirt and jacket -->
      <path d="M47 92 L81 92 Q86 100 86 104 Q64 108 42 104 Q42 100 47 92 Z" fill="#232a50"/>
      <path d="M46 99 Q44 78 54 69 L74 69 Q84 78 82 99 Q64 103 46 99 Z" fill="#3a4c94"/>
      <path d="M74 69 Q84 78 82 99 Q77 101 73 101 Q79 85 70 70 Z" fill="#2e3d7a" stroke="none"/>
      <path d="M46 99 Q44 78 54 69 L74 69 Q84 78 82 99 Q64 103 46 99 Z" fill="none"/>
      <path d="M56 70 L64 80 L72 70" fill="#f1efe6" stroke-width="2.6"/>
      <path d="M64 80 L64 100" stroke-width="2.2"/>
      <g fill="#d4a640" stroke-width="1.6">
        <circle cx="59" cy="85" r="2.2"/><circle cx="69" cy="85" r="2.2"/><circle cx="59" cy="93" r="2.2"/><circle cx="69" cy="93" r="2.2"/>
      </g>
      <!-- whistle on a celeste cord -->
      <path d="M58 72 Q60 80 72 82" fill="none" stroke="#52d3ee" stroke-width="2.4"/>
      <rect x="71" y="79" width="10" height="6" rx="3" fill="#d4a640" stroke-width="2.2"/>
      <!-- key ring of little clocks at the left hip -->
      <circle cx="45" cy="98" r="4" fill="none" stroke="#d4a640" stroke-width="2.6"/>
      <circle cx="40" cy="105" r="4.6" fill="#d4a640" stroke-width="2.4"/>
      <circle cx="40" cy="105" r="2.6" fill="#f6ecd0" stroke-width="1.4"/>
      <circle cx="49" cy="106" r="4" fill="#52d3ee" stroke-width="2.4"/>
      <circle cx="49" cy="106" r="2.2" fill="#f6ecd0" stroke-width="1.4"/>
      <!-- arms -->
      <path d="M51 73 Q40 79 39 89 L46 91 Q48 84 55 80 Z" fill="#3a4c94"/>
      <circle cx="42" cy="90" r="5.5" fill="#efd6b0" stroke-width="3"/>
      <path d="M77 73 Q88 77 91 85 L85 89 Q81 83 73 80 Z" fill="#3a4c94"/>
      <!-- bob hair behind the head -->
      <path d="M39 50 Q36 24 64 23 Q92 24 89 50 Q91 62 87 68 L41 68 Q37 62 39 50 Z" fill="#2a2030"/>
    </g>
    <circle cx="64" cy="46" r="23" fill="#efd6b0"/>
    <path d="M84 56 Q78 68 62 69 Q80 72 86.5 58 Z" fill="#d9b88f" stroke="none"/>
    <circle cx="64" cy="46" r="23" fill="none"/>
    <path d="M42 46 Q46 34 60 34 Q66 40 76 38 Q84 38 87 46 Q80 42 72 43 Q62 44 56 40 Q50 44 42 46 Z" fill="#2a2030" stroke-width="2.6"/>
    <path d="M41 46 Q39 60 43 67 L47 67 Q44 58 46 47 Z M87 46 Q89 60 85 67 L81 67 Q84 58 82 47 Z" fill="#2a2030" stroke-width="2.6"/>
    <ellipse cx="58" cy="51" rx="3.8" ry="4.8" fill="#1b1714" stroke="none"/>
    <ellipse cx="73" cy="51" rx="3.8" ry="4.8" fill="#1b1714" stroke="none"/>
    <circle cx="59.3" cy="49.3" r="1.5" fill="#fff" stroke="none"/>
    <circle cx="74.3" cy="49.3" r="1.5" fill="#fff" stroke="none"/>
    <ellipse cx="51" cy="59" rx="4.5" ry="2.6" fill="#e39a8a" opacity="0.65" stroke="none"/>
    <ellipse cx="80" cy="59" rx="4.5" ry="2.6" fill="#e39a8a" opacity="0.65" stroke="none"/>
    <path d="M63 61 Q66.5 64.5 70 61" fill="none" stroke-width="2.4"/>
    <g filter="url(#rough)">
      <!-- peaked station cap with a celeste band -->
      <path d="M40 34 Q37 20 47 16 L83 14 Q93 18 90 32 Q64 27 40 34 Z" fill="#23285a"/>
      <path d="M40 31 Q64 25 90 29 L90 35 Q64 31 40 37 Z" fill="#52d3ee" stroke-width="2.8"/>
      <circle cx="66" cy="21" r="4" fill="#d4a640" stroke-width="2.2"/>
      <path d="M60 35 Q84 30 97 38 Q85 43 62 40 Z" fill="#151936"/>
    </g>
    <circle cx="90" cy="88" r="5.5" fill="#efd6b0" stroke-width="3"/>
  </g>
</svg>
