<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" width="480" height="700">
  <!-- Living menu, Pasado: warm brick-red townhouses with candle-lit arched windows, left of the clock (key-art.jpg). -->
  <defs><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
    <radialGradient id="warm"><stop offset="0" stop-color="#ffc45a" stop-opacity="0.55"/><stop offset="1" stop-color="#ff9a30" stop-opacity="0"/></radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset="1" stop-color="#f0a848"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c88a6a"/><stop offset="1" stop-color="#8e5444"/></linearGradient>
  </defs>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- back house, right (mostly behind the clock) -->
    <rect x="250" y="300" width="230" height="400" fill="#7e4a3e"/>
    <path d="M236 306 L300 230 L470 230 L490 306 Z" fill="#5e2e26"/>
    <rect x="300" y="380" width="60" height="80" rx="4" fill="url(#pane)"/>
    <rect x="390" y="380" width="60" height="80" rx="4" fill="url(#pane)"/>
    <!-- main townhouse -->
    <rect x="0" y="236" width="290" height="464" fill="url(#wall)"/>
    <path d="M-10 246 L40 96 L230 96 L304 246 Z" fill="#7a3a2c"/>
    <path d="M80 96 L120 20 L160 96 Z" fill="#6a3026"/>
    <path d="M120 20 V-2 M110 6 H130" fill="none"/>
    <path d="M96 236 V170 A28 28 0 0 1 152 170 V236 Z" fill="#5a2a22"/>
    <path d="M108 226 V176 A16 16 0 0 1 140 176 V226 Z" fill="url(#pane)"/>
    <rect x="-10" y="232" width="314" height="26" fill="#9a5040"/>
    <rect x="-10" y="470" width="314" height="20" fill="#9a5040"/>
  </g>
  <ellipse cx="80" cy="360" rx="120" ry="120" fill="url(#warm)"/><ellipse cx="200" cy="360" rx="90" ry="110" fill="url(#warm)"/><ellipse cx="80" cy="590" rx="130" ry="130" fill="url(#warm)"/><ellipse cx="210" cy="600" rx="100" ry="120" fill="url(#warm)"/>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M26 440 V342 A52 52 0 0 1 130 342 V440 Z" fill="url(#pane)"/>
      <path d="M78 294 V440 M26 386.1 H130" fill="none" stroke-width="4"/><path d="M166 430 V340 A40 40 0 0 1 246 340 V430 Z" fill="url(#pane)"/>
      <path d="M206 304 V430 M166 380.5 H246" fill="none" stroke-width="4"/>
    <path d="M20 690 V578 A58 58 0 0 1 136 578 V690 Z" fill="url(#pane)"/>
      <path d="M78 524 V690 M20 628.4 H136" fill="none" stroke-width="4"/><path d="M166 690 V576 A46 46 0 0 1 258 576 V690 Z" fill="url(#pane)"/>
      <path d="M212 534 V690 M166 627.3 H258" fill="none" stroke-width="4"/>
  </g>
  <path d="M10 250 H290" stroke="#e8b08a" stroke-width="4" opacity="0.5"/>
</svg>
