<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Muro de Ayer: old brick-and-timber wall block. Exists only in the Past (amber round badge). -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
  </defs>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- base -->
    <path d="M13 95 L115 94 L115 115 Q64 118 13 116 Z" fill="#3a2a20"/>
    <path d="M13 99 L115 98 L115 104 L13 105 Z" fill="#8a6a3a" stroke-width="2.5"/>
    <!-- brick face -->
    <path d="M14 24 L114 23 L115 96 L13 97 Z" fill="#8c4f33"/>
    <g fill="none" stroke-width="2.2">
      <path d="M14 42 H114 M14 60 H114 M14 78 H114"/>
      <path d="M40 24 V42 M76 24 V42 M24 42 V60 M58 42 V60 M94 42 V60 M40 60 V78 M76 60 V78 M24 78 V96 M58 78 V96 M94 78 V96"/>
    </g>
    <path d="M42 26 H74 V40 H42 Z M60 62 H74 V76 H60 Z" fill="#a5623f" stroke="none"/>
    <!-- timber beams -->
    <path d="M10 30 L118 28 L118 37 L10 39 Z" fill="#6b4a2c" stroke-width="3"/>
    <path d="M10 84 L118 82 L118 91 L10 93 Z" fill="#6b4a2c" stroke-width="3"/>
    <path d="M22 33 l6 1 M60 31 l8 0 M96 86 l8 -1" fill="none" stroke-width="1.6"/>
    <g fill="#d4a640" stroke-width="1.6">
      <circle cx="18" cy="33" r="2.6"/><circle cx="110" cy="32" r="2.6"/><circle cx="18" cy="88" r="2.6"/><circle cx="110" cy="86" r="2.6"/>
    </g>
  </g>
  <!-- era badge: Past = round amber with a counter-clockwise arrow -->
  <g stroke="#1b1714" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="104" cy="20" r="13" fill="#e0a43a"/>
    <path d="M110 22 A7 7 0 1 1 104 13" fill="none" stroke-width="2.6"/>
    <path d="M101 9 L105 13 L100 16" fill="none" stroke-width="2.6"/>
  </g>
</svg>
