<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Autómata adelantado: lean forward-leaning fast automaton, big wind-up key, ram fist (breaks walls). Faces left. -->
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="14"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
  </defs>
  <ellipse cx="62" cy="114" rx="32" ry="6" fill="#000" opacity="0.3"/>
  <g filter="url(#rough)" stroke="#1b1714" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- motion lines -->
    <path d="M100 92 h14 M104 100 h10 M98 108 h8" fill="none" stroke-width="3" stroke-opacity="0.55"/>
    <!-- big wind-up key on the back -->
    <path d="M84 58 L98 60 L97 68 L83 66 Z" fill="#8a6a3a" stroke-width="2.6"/>
    <ellipse cx="106" cy="50" rx="8" ry="13" fill="#e0b24a" stroke-width="3"/>
    <ellipse cx="106" cy="78" rx="8" ry="13" fill="#e0b24a" stroke-width="3"/>
    <ellipse cx="106" cy="50" rx="3" ry="6" fill="#a97e2a" stroke-width="2"/>
    <ellipse cx="106" cy="78" rx="3" ry="6" fill="#a97e2a" stroke-width="2"/>
    <circle cx="101" cy="64" r="5" fill="#c69a50" stroke-width="2.6"/>
    <!-- legs mid-stride -->
    <path d="M66 90 L76 90 L88 104 L92 112 L78 112 L78 106 Z" fill="#344646"/>
    <path d="M48 90 L58 90 L52 102 L42 112 L28 112 L30 106 L42 102 Z" fill="#3e5353"/>
    <!-- leaning torso -->
    <path d="M34 54 Q34 47 41 47 L78 50 Q86 51 86 58 L80 91 Q79 96 73 96 L48 96 Q42 96 42 91 Z" fill="#c9a04e"/>
    <path d="M72 50 L78 50 Q86 51 86 58 L80 91 Q79 96 73 96 L68 96 Q76 74 72 50 Z" fill="#a17d36" stroke="none"/>
    <path d="M34 54 Q34 47 41 47 L78 50 Q86 51 86 58 L80 91 Q79 96 73 96 L48 96 Q42 96 42 91 Z" fill="none"/>
    <path d="M37 66 L84 69 L82 79 L40 77 Z" fill="#4f9a8e" stroke-width="2.6"/>
    <g fill="#ece2c6" stroke-width="1.4"><circle cx="41" cy="53" r="2"/><circle cx="79" cy="56" r="2"/><circle cx="48" cy="90" r="2"/><circle cx="74" cy="90" r="2"/></g>
    <!-- ram arm + hammer fist -->
    <path d="M40 60 L22 64 L22 74 L40 72" fill="#344646" stroke-width="3"/>
    <rect x="5" y="56" width="18" height="26" rx="3" fill="#8e979c"/>
    <path d="M5 64 h18 M5 74 h18" stroke-width="2.4"/>
    <path d="M19 58 L22 58 L22 80 L19 80 Z" fill="#6b7377" stroke="none"/>
    <rect x="5" y="56" width="18" height="26" rx="3" fill="none"/>
    <!-- head dome, pushed forward -->
    <path d="M22 48 Q22 18 46 18 Q70 18 70 48 Z" fill="#d8b25a"/>
    <path d="M56 21 Q70 28 70 48 L62 48 Q63 32 56 21 Z" fill="#a17d36" stroke="none"/>
    <path d="M22 48 Q22 18 46 18 Q70 18 70 48 Z" fill="none"/>
    <path d="M46 18 Q44 12 48 9 Q52 6 50 2" fill="none" stroke-width="2.6"/>
    <!-- one wide eye -->
    <ellipse cx="42" cy="35" rx="15" ry="10" fill="#f2ead6" stroke-width="3"/>
    <circle cx="36" cy="36" r="6.5" fill="#2fb5a8" stroke-width="2"/>
    <circle cx="35" cy="36" r="2.8" fill="#1b1714" stroke="none"/>
  </g>
  <circle cx="33.4" cy="33.6" r="1.6" fill="#fff"/>
</svg>
