    <path d="M64 30 l6 6 8-3 2 8 8 2-3 8 6 6-6 6 3 8-8 2-2 8-8-3-6 6-6-6-8 3-2-8-8-2 3-8-6-6 6-6-3-8 8-2 2-8 8 3 Z" fill="#c69a50"/>
    <path d="M64 8 L74 54 L120 64 L74 74 L64 120 L54 74 L8 64 L54 54 Z" fill="#ffc94a"/>
    <path d="M64 30 L69 59 L98 64 L69 69 L64 98 L59 69 L30 64 L59 59 Z" fill="#fff3c4" stroke-width="2.4"/>
  </g>
  <circle cx="64" cy="64" r="5" fill="#ffffff"/>
</svg>
