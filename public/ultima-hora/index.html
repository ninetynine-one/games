<style>@font-face{font-family:Fredoka;font-weight:500;src:url(./fonts/Fredoka-500.woff2)format("woff2");font-display:block}@font-face{font-family:Fredoka;font-weight:600;src:url(./fonts/Fredoka-600.woff2)format("woff2");font-display:block}@font-face{font-family:Fredoka;font-weight:700;src:url(./fonts/Fredoka-700.woff2)format("woff2");font-display:block}html,body{touch-action:none;height:100%;margin:0;overflow:hidden}body{background-color:#120f0d;background-image:radial-gradient(circle at 50% 40%,#f0b43c1a,#0000 55%),radial-gradient(circle,#a88c5a38 2px,#0000 3px),repeating-linear-gradient(90deg,#00000040 0 2px,#0000 2px 120px);background-size:100% 100%,40px 40px,120px 100%}#game{top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));right:var(--safe-area-inset-right,env(safe-area-inset-right,0px));bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));left:var(--safe-area-inset-left,env(safe-area-inset-left,0px));position:fixed}#rotate{z-index:10;color:#f3e9d2;text-align:center;background:#1b1714;justify-content:center;align-items:center;font:600 24px Fredoka,sans-serif;display:none;position:fixed;inset:0}@media (orientation:landscape) and (height<=500px){#rotate{display:flex}}#loading{z-index:20;background:#101010 url(./loading.jpg) 50%/contain no-repeat;transition:opacity .25s;position:fixed;inset:0}</style>

</head>
<body>
<div id="game"></div>
    <div id="loading"></div>
<div id="rotate">Gira el dispositivo</div>
<script>
  // safety net: if the boot throws before the first scene, the native splash and the loading cover must not stay up forever
  (function () {
    var hide = function () { try { window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen && window.Capacitor.Plugins.SplashScreen.hide(); } catch (e) {} };
    var fail = function () { hide(); var l = document.getElementById('loading'); if (l) l.remove(); };
    window.addEventListener('error', fail);
    window.addEventListener('unhandledrejection', fail);
    setTimeout(hide, 15000);
  })();
</script>
</body>
