<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chatarra</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>@font-face{font-family:"Baloo 2";src:url(./fonts/Baloo2.ttf);font-weight:400 800}html,body{overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;height:100%;margin:0;overflow:hidden}body{background-color:#8f4a32;background-image:radial-gradient(circle at 20px 24px,#a65a3e 0 5px,#0000 6px),radial-gradient(circle at 70px 66px,#7a3c28 0 4px,#0000 5px);background-size:96px 96px,96px 96px}:root{--sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sar:var(--safe-area-inset-right,env(safe-area-inset-right,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));--sal:var(--safe-area-inset-left,env(safe-area-inset-left,0px))}#game{top:var(--sat);right:var(--sar);bottom:var(--sab);left:var(--sal);position:fixed}#loading{z-index:20;background:#101010 url(./loading.jpg) 50%/contain no-repeat;transition:opacity .25s;position:fixed;inset:0}</style>
    <script type="module" crossorigin src="/chatarra/assets/index-DejFmvtT.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="loading"></div>
    <div style="font-family:'Baloo 2';position:absolute;visibility:hidden">.</div>
    <script>
      // Seguro de arranque: si a los 12 s sigue la pantalla de carga (excepción al iniciar), se quita el splash nativo
      // (launchAutoHide: false) y se avisa, en vez de dejar la app colgada en el splash para siempre.
      setTimeout(function () {
        var l = document.getElementById('loading');
        if (!l) return;
        try { window.Capacitor && window.Capacitor.Plugins.SplashScreen.hide(); } catch (e) {}
        l.style.cssText += ';display:flex;align-items:flex-end;justify-content:center;color:#f3e3c3;font:600 18px sans-serif;padding-bottom:12vh;text-align:center';
        l.textContent = 'No se pudo iniciar el juego. Ciérralo y vuelve a abrirlo.';
      }, 12000);
    </script>
  </body>
</html>
