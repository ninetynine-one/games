<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Chatarra · narrativa ambiental: Jardín improvisado. Carcasa de ordenador viejo usada como maceta, con un brote. -->
  <defs>
    <filter id="sk" filterUnits="userSpaceOnUse" x="-8" y="-8" width="144" height="144">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="116" rx="40" ry="7" fill="#000" opacity=".35"/>
  <g filter="url(#sk)" stroke="#1b1714" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- brote -->
    <path d="M62 56 q-2 -18 2 -30" fill="none" stroke-width="5"/>
    <path d="M62 56 q-2 -18 2 -30" fill="none" stroke="#6fa04a" stroke-width="2"/>
    <path d="M63 40 q-22 -2 -28 -18 q20 -4 28 18z" fill="#6fa04a"/>
    <path d="M64 30 q14 -18 32 -16 q-6 20 -32 16z" fill="#6fa04a"/>
    <path d="M60 36 q-10 -4 -18 -12 M68 27 q10 -6 20 -9" fill="none" stroke-width="2"/>
    <!-- carcasa (torre beige sin tapa) -->
    <path d="M30 52 h68 v56 q0 4 -4 4 h-60 q-4 0 -4 -4z" fill="#d3cdc1"/>
    <path d="M84 54 h14 v54 q0 4 -4 4 h-10z" fill="#a39c8f" stroke="none"/>
    <path d="M30 52 h68 v56 q0 4 -4 4 h-60 q-4 0 -4 -4z" fill="none"/>
    <!-- tierra -->
    <path d="M30 52 q14 -8 34 -4 q20 -4 34 4 v6 h-68z" fill="#4a2c1d"/>
    <!-- bahías de disquete y botón -->
    <rect x="38" y="66" width="38" height="9" rx="2" fill="#bdb6a9" stroke-width="3"/>
    <path d="M44 70.5 h24" stroke-width="2.6"/>
    <rect x="38" y="80" width="38" height="9" rx="2" fill="#bdb6a9" stroke-width="3"/>
    <circle cx="48" cy="100" r="4.5" fill="#8f887b" stroke-width="3"/>
    <circle cx="66" cy="100" r="2.4" fill="#6fd06a" stroke="none"/>
    <!-- abolladura y pegatina -->
    <path d="M86 70 l6 4 -2 6" fill="none" stroke-width="2.4"/>
    <rect x="84" y="88" width="10" height="12" rx="1" fill="#e9c97a" stroke-width="2.4" transform="rotate(8 89 94)"/>
  </g>
</svg>
