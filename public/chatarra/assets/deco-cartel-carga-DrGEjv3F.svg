<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128" width="256" height="128">
  <!-- Chatarra · decoración: cartel de pared pintado a mano «ZONA DE CARGA» con rayas de peligro. -->
  <defs>
    <filter id="sk" filterUnits="userSpaceOnUse" x="-8" y="-8" width="272" height="144">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="461"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#sk)" stroke="#1b1714" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <g transform="rotate(2 128 64)">
      <rect x="14" y="20" width="228" height="88" rx="6" fill="#f2b632"/>
      <path d="M20 26 l20 0 -16 22 h-4z M60 26 h18 l-40 56 h-18 v-4z M98 26 h18 l-60 80 h-18z" fill="#1b1714" stroke="none" opacity=".85"/>
      <rect x="64" y="34" width="168" height="60" rx="4" fill="#e8e2d2" stroke-width="3"/>
      <text x="148" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" textLength="150" lengthAdjust="spacingAndGlyphs" fill="#c9652e" stroke="#1b1714" stroke-width="2.2" paint-order="stroke">ZONA DE CARGA</text>
      <circle cx="24" cy="98" r="3" fill="#1b1714" stroke="none"/><circle cx="232" cy="30" r="3" fill="#1b1714" stroke="none"/>
    </g>
  </g>
</svg>
