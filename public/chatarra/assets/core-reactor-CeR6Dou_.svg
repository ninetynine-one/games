<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Chatarra · núcleo: reactor comunitario en cúpula turquesa (paisaje.jpg), sobre base redonda con piezas oxidadas y amarillas. -->
  <defs>
    <filter id="sk" filterUnits="userSpaceOnUse" x="-8" y="-8" width="144" height="144">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="glow"><stop offset="0" stop-color="#2ee6d0" stop-opacity=".55"/><stop offset="1" stop-color="#2ee6d0" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="64" cy="121" rx="56" ry="6" fill="#000" opacity=".35"/>
  <circle cx="64" cy="66" r="56" fill="url(#glow)"/>
  <g filter="url(#sk)" stroke="#1b1714" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- base redonda: canto y cara superior con aro oxidado -->
    <path d="M10 96 v10 a54 15 0 0 0 108 0 v-10z" fill="#2c3943"/>
    <ellipse cx="64" cy="96" rx="54" ry="15" fill="#4f6676"/>
    <ellipse cx="64" cy="96" rx="44" ry="11" fill="#36322f" stroke-width="3"/>
    <path d="M16 104 l6 4 M30 110 l6 3 M92 113 l6 -3 M106 108 l6 -4" stroke="#f2b632" stroke-width="3.5"/>
    <circle cx="20" cy="97" r="2.4" fill="#d8d2c4" stroke-width="1.5"/><circle cx="108" cy="97" r="2.4" fill="#d8d2c4" stroke-width="1.5"/>
    <!-- patas -->
    <rect x="34" y="88" width="14" height="12" rx="4" fill="#56656e" stroke-width="3"/>
    <rect x="80" y="88" width="14" height="12" rx="4" fill="#56656e" stroke-width="3"/>
    <!-- tuberías oxidadas a los lados -->
    <path d="M20 94 v-20 h10" fill="none" stroke-width="10"/>
    <path d="M20 94 v-20 h10" fill="none" stroke="#c9652e" stroke-width="4"/>
    <path d="M108 94 v-26 h-10" fill="none" stroke-width="10"/>
    <path d="M108 94 v-26 h-10" fill="none" stroke="#c9652e" stroke-width="4"/>
    <!-- cuerpo en cúpula -->
    <path d="M28 88 V62 a36 38 0 0 1 72 0 V88 a36 9 0 0 1 -72 0z" fill="#2ec4b4"/>
    <path d="M82 30 q18 10 18 32 V88 q-6 7 -20 8 q10 -30 2 -66z" fill="#1d9488" stroke="none"/>
    <path d="M38 52 q4 -16 18 -22" fill="none" stroke="#9ff5ea" stroke-width="4"/>
    <path d="M28 88 V62 a36 38 0 0 1 72 0 V88 a36 9 0 0 1 -72 0z" fill="none"/>
    <path d="M28 80 a36 9 0 0 0 72 0" fill="none" stroke-width="3"/>
    <rect x="44" y="84" width="40" height="8" rx="2" fill="#f2b632" stroke-width="3"/>
    <path d="M50 84 l-4 8 M58 84 l-4 8 M66 84 l-4 8 M74 84 l-4 8 M82 84 l-4 8" stroke="#1b1714" stroke-width="2.5"/>
    <!-- visor con ojos -->
    <rect x="38" y="52" width="52" height="22" rx="10" fill="#15211f"/>
    <rect x="47" y="58" width="10" height="9" rx="3" fill="#e8fffb" stroke="none"/>
    <rect x="71" y="58" width="10" height="9" rx="3" fill="#e8fffb" stroke="none"/>
    <!-- orejeras con tuerca -->
    <circle cx="27" cy="66" r="7" fill="#c9652e" stroke-width="3"/>
    <circle cx="101" cy="66" r="7" fill="#c9652e" stroke-width="3"/>
    <circle cx="27" cy="66" r="2.2" fill="#1b1714" stroke="none"/><circle cx="101" cy="66" r="2.2" fill="#1b1714" stroke="none"/>
    <!-- remaches y parche de cinta -->
    <circle cx="40" cy="80" r="2" fill="#9ff5ea" stroke-width="1.5"/><circle cx="88" cy="80" r="2" fill="#9ff5ea" stroke-width="1.5"/>
    <path d="M78 34 l12 7 -3 5 -12 -7z" fill="#e9c97a" stroke-width="2.6"/>
    <!-- pomo superior -->
    <rect x="58" y="18" width="12" height="10" rx="2" fill="#c9652e" stroke-width="3"/>
    <circle cx="64" cy="14" r="8" fill="#2ee6d0"/>
    <circle cx="61" cy="11" r="2.6" fill="#c9fff6" stroke="none"/>
  </g>
</svg>
