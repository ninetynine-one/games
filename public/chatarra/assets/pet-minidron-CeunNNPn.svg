<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Chatarra · mascota: Minidrón. Esfera turquesa con lente, hélices amarillas y patas a rayas; flota con sombra separada. -->
