    <circle cx="210" cy="18" r="5"/><circle cx="366" cy="18" r="5"/><circle cx="210" cy="174" r="5"/><circle cx="366" cy="174" r="5"/>
    <circle cx="18" cy="210" r="5"/><circle cx="174" cy="210" r="5"/><circle cx="18" cy="366" r="5"/><circle cx="174" cy="366" r="5"/>
    <circle cx="210" cy="210" r="5"/><circle cx="366" cy="210" r="5"/><circle cx="210" cy="366" r="5"/><circle cx="366" cy="366" r="5"/>
  </g>
