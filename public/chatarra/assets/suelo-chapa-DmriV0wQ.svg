  <g stroke="#1b1714" stroke-opacity=".5" stroke-width="3">
    <rect x="3" y="3" width="186" height="186" rx="5" fill="#b8693c"/>
    <rect x="195" y="3" width="186" height="186" rx="5" fill="#a85f36"/>
    <rect x="3" y="195" width="186" height="186" rx="5" fill="#ad6238"/>
    <rect x="195" y="195" width="186" height="186" rx="5" fill="#bd6f40"/>
  </g>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M10 182 V12 q0 -3 3 -3 H182" stroke="#d48a58"/><path d="M202 182 V12 q0 -3 3 -3 H374" stroke="#c98050"/>
    <path d="M10 374 V204 q0 -3 3 -3 H182" stroke="#cc8352"/><path d="M202 374 V204 q0 -3 3 -3 H374" stroke="#d8905e"/>
  </g>
