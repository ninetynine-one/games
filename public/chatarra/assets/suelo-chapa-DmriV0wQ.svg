  <g opacity=".3">
    <path d="M60 96 q20 -14 50 -4 q14 10 -6 18 q-30 6 -44 -14z" fill="#7a3a1c"/><path d="M262 290 q24 -10 54 0 q10 12 -14 16 q-30 2 -40 -16z" fill="#7a3a1c"/>
