<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384" height="384">
  <!-- Chatarra · suelo del Astillero Oxidado (nivel 4): chapas naranja oxidado remachadas, con manchas de óxido. Tileable. -->
