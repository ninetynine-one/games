<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Chatarra · narrativa ambiental: Placa con números borrados. Placa de mantenimiento con el número de serie raspado y un símbolo propio dibujado encima. -->
  <defs>
    <filter id="sk" filterUnits="userSpaceOnUse" x="-8" y="-8" width="144" height="144">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="141"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <ellipse cx="64" cy="114" rx="48" ry="7" fill="#000" opacity=".35"/>
  <g filter="url(#sk)" stroke="#1b1714" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- placa -->
    <rect x="12" y="20" width="104" height="86" rx="6" fill="#a9b6be"/>
    <path d="M96 22 h14 q4 0 4 4 v74 q0 4 -4 4 h-14z" fill="#7d8b94" stroke="none"/>
    <rect x="12" y="20" width="104" height="86" rx="6" fill="none"/>
    <!-- tornillos -->
    <g fill="#c3ced5" stroke-width="2.6">
      <circle cx="22" cy="30" r="4.5"/><circle cx="106" cy="30" r="4.5"/>
      <circle cx="22" cy="96" r="4.5"/><circle cx="106" cy="96" r="4.5"/>
    </g>
    <path d="M19 30 h6 M103 30 h6 M19 96 h6 M103 96 h6" stroke-width="2"/>
    <!-- líneas manuscritas borrosas -->
    <path d="M32 34 q6 -3 12 0 t12 0 t12 0 t12 0 M32 44 q6 -3 12 0 t12 0 t12 0" fill="none" stroke="#56656e" stroke-width="2.6"/>
    <path d="M32 54 q5 -3 10 0 t10 0 t10 0 t10 0 t10 0" fill="none" stroke="#56656e" stroke-width="2.6" opacity=".6"/>
    <!-- número de serie: queda solo el principio -->
    <text x="30" y="88" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20" fill="#2c3943" stroke="none">RR-0</text>
    <path d="M78 70 q14 -2 26 2 q2 10 -2 20 q-12 2 -26 -2 q-2 -10 2 -20z" fill="#c3ced5" stroke="none"/>
    <path d="M76 74 l26 2 M76 80 l28 -1 M76 86 l26 2" stroke="#7d8b94" stroke-width="1.6"/>
    <!-- símbolo propio dibujado encima: engranaje con corazón -->
    <circle cx="86" cy="76" r="15" fill="none" stroke="#c9652e" stroke-width="4" stroke-dasharray="5 3"/>
    <path d="M86 86 q-12 -8 -10 -14 q2 -6 10 -1 q8 -5 10 1 q2 6 -10 14z" fill="#e04a32" stroke-width="3"/>
  </g>
</svg>
