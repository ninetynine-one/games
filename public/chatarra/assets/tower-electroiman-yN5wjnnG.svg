    <path d="M52 40 L47 78" stroke="#e8935c" stroke-width="3"/>
    <circle cx="56" cy="70" r="1.6" fill="#7a3518" stroke="none"/><circle cx="70" cy="46" r="1.4" fill="#7a3518" stroke="none"/><circle cx="74" cy="80" r="1.8" fill="#7a3518" stroke="none"/>
    <circle cx="62" cy="44" r="5" fill="#2ee6d0" stroke-width="3"/>
    <circle cx="62" cy="60" r="5.5" fill="#2ee6d0" stroke-width="3"/>
    <circle cx="62" cy="77" r="6" fill="#2ee6d0" stroke-width="3"/>
