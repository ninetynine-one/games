      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="glow"><stop offset="0" stop-color="#2ee6d0" stop-opacity=".65"/><stop offset="1" stop-color="#2ee6d0" stop-opacity="0"/></radialGradient>
