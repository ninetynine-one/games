<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Chatarra · terreno: Cinta transportadora vertical, vista desde arriba. Sentido: hacia abajo (sur); volteada, hacia arriba. Tileable en Y. -->
  <defs>
    <clipPath id="band"><rect x="24" y="0" width="80" height="128"/></clipPath>
  </defs>
  <g stroke="#1b1714" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- banda -->
    <rect x="22" y="-4" width="84" height="136" fill="#2b2826" stroke="none"/>
    <g clip-path="url(#band)">
      <!-- rodillos horizontales -->
      <path d="M24 0 h80 M24 32 h80 M24 64 h80 M24 96 h80 M24 128 h80" stroke="#3a3632" stroke-width="7"/>
      <path d="M24 0 h80 M24 32 h80 M24 64 h80 M24 96 h80 M24 128 h80" stroke="#1b1714" stroke-width="2"/>
      <!-- chevrones grandes hacia abajo: gris y amarillo (forma, no solo color) -->
      <path d="M32 6 l32 26 32 -26" fill="none" stroke="#1b1714" stroke-width="16"/>
      <path d="M32 6 l32 26 32 -26" fill="none" stroke="#6b655c" stroke-width="9"/>
      <path d="M32 70 l32 26 32 -26" fill="none" stroke="#1b1714" stroke-width="16"/>
      <path d="M32 70 l32 26 32 -26" fill="none" stroke="#f2b632" stroke-width="9"/>
    </g>
    <!-- rieles laterales -->
    <rect x="6" y="-4" width="18" height="136" fill="#5f7a8c"/>
    <rect x="104" y="-4" width="18" height="136" fill="#435868"/>
    <circle cx="15" cy="32" r="3" fill="#1b1714" stroke="none"/><circle cx="15" cy="96" r="3" fill="#1b1714" stroke="none"/>
    <circle cx="113" cy="32" r="3" fill="#1b1714" stroke="none"/><circle cx="113" cy="96" r="3" fill="#1b1714" stroke="none"/>
  </g>
</svg>
