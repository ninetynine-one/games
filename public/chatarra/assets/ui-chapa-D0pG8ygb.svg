<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Chatarra · HUD: panel de chapa naranja oxidada con remaches. Nine-slice con márgenes de 24 (el centro se estira: liso). -->
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9602f"/><stop offset=".5" stop-color="#a5532a"/><stop offset="1" stop-color="#8e4423"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="9" fill="url(#v)" stroke="#1b1714" stroke-width="4"/>
  <!-- canto claro arriba y sombra abajo -->
  <path d="M10 7 H86" stroke="#e08a52" stroke-width="3" stroke-linecap="round"/>
  <path d="M7 12 V84" stroke="#c46a38" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 89 H86" stroke="#6e3016" stroke-width="3" stroke-linecap="round"/>
  <path d="M89 12 V84" stroke="#7a3719" stroke-width="2.5" stroke-linecap="round"/>
  <!-- filete interior -->
  <rect x="12" y="12" width="72" height="72" rx="4" fill="none" stroke="#7a3719" stroke-width="2" opacity=".8"/>
  <!-- remaches -->
  <g fill="#d8a070" stroke="#1b1714" stroke-width="2">
    <circle cx="12" cy="12" r="4"/><circle cx="84" cy="12" r="4"/><circle cx="12" cy="84" r="4"/><circle cx="84" cy="84" r="4"/>
  </g>
  <g fill="#fff2d8" opacity=".8"><circle cx="11" cy="11" r="1.3"/><circle cx="83" cy="11" r="1.3"/><circle cx="11" cy="83" r="1.3"/><circle cx="83" cy="83" r="1.3"/></g>
  <!-- óxido en las esquinas -->
  <g fill="#6e3016" opacity=".45"><ellipse cx="20" cy="88" rx="6" ry="2"/><ellipse cx="88" cy="20" rx="2" ry="5"/></g>
</svg>
