<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 128" width="256" height="128">
  <!-- Chatarra · narrativa ambiental: Señal pintada a mano «TALLER LIBRE» en un tablón sobre dos patas. -->
  <defs>
    <filter id="sk" filterUnits="userSpaceOnUse" x="-8" y="-8" width="272" height="144">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <ellipse cx="128" cy="118" rx="96" ry="7" fill="#000" opacity=".35"/>
  <g filter="url(#sk)" stroke="#1b1714" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- patas -->
    <rect x="62" y="60" width="12" height="56" rx="2" fill="#6f3a1d"/>
    <rect x="182" y="60" width="12" height="56" rx="2" fill="#6f3a1d"/>
    <g transform="rotate(-3 128 48)">
      <!-- tablón -->
      <rect x="18" y="14" width="220" height="70" rx="5" fill="#8a4a26"/>
      <path d="M200 17 q34 0 35 6 v56 h-35z" fill="#6f3a1d" stroke="none"/>
      <rect x="18" y="14" width="220" height="70" rx="5" fill="none"/>
      <path d="M22 49 h212" stroke-width="2.4"/>
      <circle cx="30" cy="24" r="3" fill="#1b1714" stroke="none"/><circle cx="226" cy="24" r="3" fill="#1b1714" stroke="none"/>
      <circle cx="30" cy="74" r="3" fill="#1b1714" stroke="none"/><circle cx="226" cy="74" r="3" fill="#1b1714" stroke="none"/>
      <!-- mano de pintura crema -->
      <path d="M36 24 q90 -6 184 2 q4 24 -2 48 q-92 6 -180 -2 q-6 -24 -2 -48z" fill="#e8e2d2" stroke-width="3"/>
      <!-- letras pintadas -->
      <text x="128" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="32" textLength="168" lengthAdjust="spacingAndGlyphs" fill="#c9652e" stroke="#1b1714" stroke-width="2.4" paint-order="stroke">TALLER LIBRE</text>
      <!-- goterones -->
      <path d="M70 66 v6 M162 67 v5" stroke="#c9652e" stroke-width="3"/>
    </g>
  </g>
</svg>
