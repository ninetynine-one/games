<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Chatarra · enemigo: Compactadora. Caja ancha y baja sobre orugas, con boca de prensa. Contorno claro. -->
  <defs>
    <filter id="sk" filterUnits="userSpaceOnUse" x="-8" y="-8" width="144" height="144"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="23"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="rim" filterUnits="userSpaceOnUse" x="-8" y="-8" width="144" height="144"><feMorphology in="SourceAlpha" operator="dilate" radius="3" result="d"/><feFlood flood-color="#f4efe6"/><feComposite in2="d" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="64" cy="114" rx="56" ry="7" fill="#000" opacity=".4"/>
  <g filter="url(#rim)"><g filter="url(#sk)" stroke="#1b1714" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- orugas -->
    <rect x="8" y="86" width="112" height="26" rx="13" fill="#3a3d40"/>
    <circle cx="22" cy="99" r="7" fill="#8f969a" stroke-width="3"/>
    <circle cx="46" cy="99" r="7" fill="#8f969a" stroke-width="3"/>
    <circle cx="70" cy="99" r="7" fill="#8f969a" stroke-width="3"/>
    <circle cx="94" cy="99" r="7" fill="#8f969a" stroke-width="3"/>
    <circle cx="108" cy="99" r="4" fill="#8f969a" stroke-width="3"/>
    <!-- chimenea -->
    <rect x="22" y="28" width="12" height="22" rx="3" fill="#5c6166"/>
    <rect x="19" y="24" width="18" height="7" rx="3" fill="#3a3d40" stroke-width="3"/>
    <!-- caja -->
    <rect x="14" y="46" width="100" height="44" rx="8" fill="#e9e7e1"/>
    <path d="M94 48 h12 q6 0 6 6 v30 q0 6 -6 6 h-12z" fill="#bdbab1" stroke="none"/>
    <rect x="14" y="46" width="100" height="44" rx="8" fill="none"/>
    <path d="M22 52 h20 M86 52 h20" stroke="#9a978e" stroke-width="2.5"/>
    <!-- boca de prensa -->
    <rect x="36" y="58" width="56" height="26" rx="4" fill="#1f2429"/>
    <path d="M40 58 l5 7 5 -7 5 7 5 -7 5 7 5 -7 5 7 5 -7 5 7 5 -7" fill="#cfd3d4" stroke-width="2.5"/>
    <path d="M40 84 l5 -7 5 7 5 -7 5 7 5 -7 5 7 5 -7 5 7 5 -7 5 7" fill="#cfd3d4" stroke-width="2.5"/>
    <!-- luces rojas -->
    <circle cx="24" cy="70" r="5" fill="#ff5a48" stroke-width="3"/>
    <circle cx="104" cy="70" r="5" fill="#ff5a48" stroke-width="3"/>
  </g></g>
</svg>
