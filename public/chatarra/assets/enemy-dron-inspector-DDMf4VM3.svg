<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Chatarra · enemigo: Dron Inspector. Esfera con 4 hélices y ojo rojo; flota con la sombra separada. Contorno claro. -->
  <defs>
    <filter id="sk" filterUnits="userSpaceOnUse" x="-8" y="-8" width="144" height="144"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="25"/><feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="rim" filterUnits="userSpaceOnUse" x="-8" y="-8" width="144" height="144"><feMorphology in="SourceAlpha" operator="dilate" radius="3" result="d"/><feFlood flood-color="#f4efe6"/><feComposite in2="d" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="64" cy="116" rx="22" ry="5" fill="#000" opacity=".35"/>
  <g filter="url(#rim)"><g filter="url(#sk)" stroke="#1b1714" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- hélices de atrás -->
    <path d="M52 40 L36 26 M76 40 L92 26" fill="none" stroke-width="7"/>
    <path d="M36 26 v-6 M92 26 v-6" fill="none" stroke-width="4"/>
    <ellipse cx="36" cy="18" rx="14" ry="4.5" fill="#4b4f53"/>
    <ellipse cx="92" cy="18" rx="14" ry="4.5" fill="#4b4f53"/>
    <!-- patas-pincho -->
    <path d="M52 74 l-7 14 M64 78 v16 M76 74 l7 14" fill="none" stroke-width="5"/>
    <!-- esfera -->
    <circle cx="64" cy="54" r="25" fill="#f1efe9"/>
    <path d="M80 36 q10 10 8 24 q-2 16 -18 19 q14 -16 10 -43z" fill="#c9c6bd" stroke="none"/>
    <circle cx="64" cy="54" r="25" fill="none"/>
    <circle cx="64" cy="56" r="11" fill="#1f2429"/>
    <circle cx="64" cy="56" r="6.5" fill="#e0402f" stroke="none"/>
    <circle cx="61" cy="53" r="2.2" fill="#fff" stroke="none"/>
    <!-- hélices delanteras -->
    <path d="M42 54 L18 46 M86 54 L110 46" fill="none" stroke-width="7"/>
    <path d="M42 54 L18 46 M86 54 L110 46" fill="none" stroke="#8f969a" stroke-width="2.5"/>
    <path d="M18 46 v-8 M110 46 v-8" fill="none" stroke-width="4"/>
    <ellipse cx="18" cy="36" rx="16" ry="5" fill="#5c6166"/>
    <ellipse cx="110" cy="36" rx="16" ry="5" fill="#5c6166"/>
  </g></g>
</svg>
