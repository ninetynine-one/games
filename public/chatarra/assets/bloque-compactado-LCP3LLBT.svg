<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Chatarra · muro: Chasis compactado. Lo que queda de una Compactadora vencida; ocupa una celda y hace de muro. -->
  <defs>
    <filter id="sk" filterUnits="userSpaceOnUse" x="-8" y="-8" width="144" height="144">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="45"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="hz"><rect x="14" y="70" width="100" height="10"/></clipPath>
  </defs>
  <g filter="url(#sk)" stroke="#1b1714" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- huella de bloque -->
    <rect x="10" y="46" width="108" height="76" rx="5" fill="#2e2a26"/>
    <!-- oruga suelta -->
    <rect x="6" y="100" width="116" height="20" rx="10" fill="#36322f" transform="rotate(-3 64 110)"/>
    <circle cx="22" cy="111" r="5" fill="#6b655c" stroke-width="3"/><circle cx="54" cy="110" r="5" fill="#6b655c" stroke-width="3"/><circle cx="96" cy="108" r="5" fill="#6b655c" stroke-width="3"/>
    <!-- cuerpo aplastado -->
    <path d="M14 56 L50 48 L80 54 L114 46 L116 100 L12 104 Z" fill="#bdb6a9"/>
    <path d="M86 54 L114 46 L116 100 L92 101 Z" fill="#8f887b" stroke="none"/>
    <path d="M14 56 L50 48 L80 54 L114 46 L116 100 L12 104 Z" fill="none"/>
    <rect x="14" y="70" width="100" height="10" fill="#f2b632" stroke="none"/>
    <g clip-path="url(#hz)" fill="#1b1714" stroke="none"><path d="M12 80 l10 -10 h7 l-10 10z M32 80 l10 -10 h7 l-10 10z M52 80 l10 -10 h7 l-10 10z M72 80 l10 -10 h7 l-10 10z M92 80 l10 -10 h7 l-10 10z"/></g>
    <path d="M14 70 h100 M14 80 h100" stroke-width="3"/>
    <!-- visera rota, ojos apagados -->
    <path d="M32 58 h58 l-4 8 h-50z" fill="#1b1714"/>
    <path d="M44 61 l8 2 M78 61 l-8 2" stroke="#6b655c" stroke-width="3"/>
    <!-- abolladuras y tubo doblado -->
    <path d="M30 88 q8 -6 16 0 M70 90 q8 -6 18 -2" fill="none" stroke-width="3"/>
    <path d="M100 48 q6 -16 18 -16" fill="none" stroke-width="9"/><path d="M100 48 q6 -16 18 -16" fill="none" stroke="#36322f" stroke-width="4"/>
    <path d="M58 92 l6 -6 6 6 -6 6z" fill="#c9652e" stroke-width="3"/>
  </g>
</svg>
