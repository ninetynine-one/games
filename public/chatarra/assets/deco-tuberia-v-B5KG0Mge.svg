<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 256" width="64" height="256">
  <!-- Chatarra · decoración: tramo vertical de tubería de pared, cobre oxidado. Tileable arriba/abajo (el tubo cruza los bordes sin filtro); brida y remache con trazo a mano. -->
  <defs>
    <filter id="sk" filterUnits="userSpaceOnUse" x="-8" y="-8" width="80" height="272">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="301"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- tubo continuo (sin filtro para que encaje entre tiles) -->
  <rect x="18" y="-4" width="28" height="264" fill="#a8653a"/>
  <rect x="36" y="-4" width="10" height="264" fill="#7a3f22"/>
  <rect x="23" y="-4" width="5" height="264" fill="#c98a55"/>
  <path d="M18 -4 v264 M46 -4 v264" stroke="#1b1714" stroke-width="4"/>
  <!-- manchas de óxido verdoso -->
  <path d="M30 40 q4 10 0 22 M40 196 q-3 8 1 18" stroke="#5f7a6a" stroke-width="4" fill="none" stroke-linecap="round" opacity=".55"/>
  <g filter="url(#sk)" stroke="#1b1714" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- brida -->
    <rect x="9" y="140" width="46" height="22" rx="4" fill="#8f887b"/>
    <path d="M42 142 h11 v18 h-11z" fill="#6c665d" stroke="none"/>
    <rect x="9" y="140" width="46" height="22" rx="4" fill="none"/>
    <path d="M10 151 h44" stroke-width="2.4"/>
    <circle cx="16" cy="151" r="2.6" fill="#1b1714" stroke="none"/><circle cx="48" cy="151" r="2.6" fill="#1b1714" stroke="none"/>
    <!-- remache -->
    <circle cx="32" cy="72" r="5" fill="#c98a55" stroke-width="3"/>
    <circle cx="30.5" cy="70.5" r="1.6" fill="#f0c89a" stroke="none"/>
  </g>
</svg>
